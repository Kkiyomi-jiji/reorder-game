<head>

</head>
<body>
  <div class="wrap" id="root"></div>

<script>
/** =========================
 * Kimi’s Classroom Tools
 * Word Order Game (Final + normalize check)
 * CSV columns: g,set,sentence,ja
 * - g: 1/2/3 (numbers)
 * - set: p01, test1, review...
 * ========================= */

/** ★先生が触るのはここだけ（任意） */
const DEFAULT_CSV_URL = ""; // 自分用のCSVを固定したいならここに（空でもOK）

/** ★宿題ページ（任意：あなた用） */
const TODAY_HOMEWORK = {
  title: "今日の宿題はこちら",
  note: "最後に出る結果をスクショして提出してね。",
  items: [
    { g:"1", set:"p01", label:"宿題① 1年 p01" },
    { g:"3", set:"p01", label:"宿題② 3年 p01" },
    { g:"2", set:"p08", label:"宿題③ 2年 p08" },
  ]
};

/** ====== ここから下は基本触らない ====== */
const LS_KEY = "kct_wordorder_csv_v6";
const root = document.getElementById("root");
const params = new URLSearchParams(location.search);

const VIEW = (params.get("view") || "").trim();      // view=homework
let SET = (params.get("set") || "").trim();          // set=p01
const HW = (params.get("hw") === "1");               // hw=1
const TEACHER = (params.get("teacher") === "1");     // teacher=1
const G = (params.get("g") || "").trim();            // g=1/2/3

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function footerHtml(){
  return `
    <div class="footer">
      <b>Kimi’s Classroom Tools</b><br>
      Created by Kimi
    </div>
  `;
}
function setRootHtml(html){
  root.innerHTML = html + footerHtml();
}

function normalizeCsvUrl(u){ return (u || "").trim(); }
function getCsvFromQuery(){
  const q = params.get("csv");
  if(!q) return "";
  try { return decodeURIComponent(q); } catch { return q; }
}
function getCsvFromStorage(){
  try { return localStorage.getItem(LS_KEY) || ""; } catch { return ""; }
}
function saveCsvToStorage(u){
  try { localStorage.setItem(LS_KEY, u); } catch {}
}
function clearStoredCsv(){
  try { localStorage.removeItem(LS_KEY); } catch {}
}

function buildUrl(qsObj){
  const base = location.origin + location.pathname;
  const qs = new URLSearchParams();
  for(const [k,v] of Object.entries(qsObj || {})){
    if(v !== undefined && v !== null && String(v).trim() !== ""){
      qs.set(k, String(v));
    }
  }
  const s = qs.toString();
  return s ? (base + "?" + s) : base;
}

function gLabel(g){
  if(String(g) === "1") return "1年";
  if(String(g) === "2") return "2年";
  if(String(g) === "3") return "3年";
  return "—";
}

function normalizeGCell(v){
  const s = String(v ?? "").trim();
  if(s === "1" || s === "2" || s === "3") return s;
  const low = s.toLowerCase();
  if(low.startsWith("g1")) return "1";
  if(low.startsWith("g2")) return "2";
  if(low.startsWith("g3")) return "3";
  return "";
}

/** ★採点用：見た目が同じなら正解にする正規化 */
function normalizeForCheck(s){
  return String(s || "")
    .replace(/\u00A0/g, " ")          // NBSP → space
    .replace(/[’‘]/g, "'")            // ’ → '
    .replace(/[“”]/g, '"')            // “ ” → "
    .replace(/\s+/g, " ")             // 連続スペース → 1つ
    .trim()
    .replace(/\s+([?.!,;:])/g, "$1"); // 記号の前の空白を消す（Tower ? → Tower?）
}

/** ---------------- CSV parse ----------------
 * ヘッダー：g,set,sentence,ja
 * - 旧データ（set,sentence,ja）も読める（g="" 扱い）
 */
function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let i = 0;
  let field = "";
  let inQuotes = false;
  const pushField = (arr) => { arr.push(field); field = ""; };
  let current = [];

  while(i < text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      } else { field += c; i++; continue; }
    } else {
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ','){ pushField(current); i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){
        pushField(current);
        rows.push(current);
        current = [];
        i++; continue;
      }
      field += c; i++; continue;
    }
  }
  pushField(current);
  if(current.length > 1 || (current[0] ?? "").trim() !== "") rows.push(current);

  if(rows.length > 0) rows.shift(); // header

  return rows
    .filter(r => r.length >= 2)
    .map(r => {
      const c0 = String(r[0] ?? "").trim();
      const isG = (c0 === "1" || c0 === "2" || c0 === "3" || /^g[123]/i.test(c0));
      if(isG){
        return {
          g: normalizeGCell(r[0]),
          set: String(r[1] ?? "").trim(),
          en:  String(r[2] ?? "").trim(),
          ja:  String(r.slice(3).join(",") ?? "").trim()
        };
      }else{
        return {
          g: "",
          set: String(r[0] ?? "").trim(),
          en:  String(r[1] ?? "").trim(),
          ja:  String(r.slice(2).join(",") ?? "").trim()
        };
      }
    })
    .filter(x => x.set && x.en);
}

async function fetchCSVOnce(csvUrl){
  const url = csvUrl + (csvUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("fetch failed: " + res.status + " " + res.statusText);
  const text = await res.text();
  return parseCSV(text);
}

function uniqueSets(rows){
  return [...new Set(rows.map(r => r.set))].sort((a,b)=>a.localeCompare(b,"ja"));
}

/** ---------------- UI: Student Home ---------------- */

        <a class="pill" href="${escapeHtml(buildUrl({view:"homework", csv: csvUrl||""}))}">宿題ページ</a>

/** ---------------- UI: Teacher Setup ---------------- */
function showTeacherSetup(csvUrl, errMsg=""){
  setRootHtml(`
    <div style="max-width:760px;margin:40px auto 0;padding:0 10px">
      <h1 style="font-size:22px;margin:0 0 10px">先生設定</h1>
      <div class="small">
        スプレッドシート列：<code>g</code> / <code>set</code> / <code>sentence</code> / <code>ja</code>（jaは任意）<br>
        ① <b>ファイル → 共有 → ウェブに公開</b> でCSVを公開<br>
        ② URLの最後が <code>pub?output=csv</code> のリンクを貼ってください
      </div>

      <div class="card">
        <div class="hint">CSV URL</div>
        <input id="csvInput" type="text" value="${escapeHtml(csvUrl||"")}"
          placeholder="https://docs.google.com/.../pub?output=csv" />
        <div class="row" style="margin-top:10px">
          <button class="btnbig" id="btnSave">保存して生徒画面へ</button>
          <button id="btnClear">保存を消す</button>
          <button id="btnHow">公開のしかた</button>
          <button id="btnBack">生徒画面へ戻る</button>
        </div>

        <div class="hint">同僚に配るとき（混ざりません）</div>
        <div class="small">
          同僚は同僚のCSVを使えばOK：<br>

        </div>

<b>公開のしかた</b>
1) スプレッドシート → ファイル

3) URLの最後が pub?output=csv のリンクを使う
4) 追記したのに反映されない時は「公開を停止→再公開」
    `.trim());
  });

  document.getElementById("btnBack").addEventListener("click", () => {
    location.href = buildUrl({ csv: normalizeCsvUrl(getCsvFromQuery() || getCsvFromStorage() || DEFAULT_CSV_URL) });
  });
}

        <button onclick="location.href='${escapeHtml(buildUrl({csv: csvUrl||""}))}'">生徒画面へ</button>

/** ---------------- UI: Set selector (by g) ---------------- */
function showSetSelector(csvUrl, rows){
  const gg = String(G || "").trim();
  const filtered = rows.filter(r => r.g === gg);
  const sets = uniqueSets(filtered);

  setRootHtml(`
    <div style="max-width:720px;margin:40px auto 0;padding:0 16px;text-align:center">
      <h1 style="font-size:22px;margin:0 0 12px">セットを選んでください（${escapeHtml(gLabel(gg))}）</h1>

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
        ${sets.length ? sets.map(s =>
          `<button class="btnbig" onclick="location.href='${escapeHtml(buildUrl({g: gg, set:s, csv:csvUrl||""}))}'">${escapeHtml(s)}</button>`
        ).join("") : `<div class="warn">この学年にセットがありません。g列が1/2/3か確認してください。</div>`}
      </div>

      <div class="row" style="margin-top:18px;justify-content:center">
        <button onclick="location.href='${escapeHtml(buildUrl({csv:csvUrl||""}))}'">生徒トップへ</button>
        <button onclick="location.href='${escapeHtml(buildUrl({view:"homework", csv:csvUrl||""}))}'">宿題ページ</button>
        <button onclick="location.href='${escapeHtml(buildUrl({teacher:"1", csv:csvUrl||""}))}'">先生はこちら</button>
      </div>
    </div>
  `);
}

/** ---------------- Game ---------------- */
function formatTime(ms){
  const s = Math.floor(ms/1000);
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return `${mm}:${ss}`;
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function tokenize(sentence){
  return sentence.trim().split(/\s+/);
}

function renderGameShell(){
  setRootHtml(`
    <h1>Word Order Game</h1>

    <div class="row">
      <button id="btnCheck">答え合わせ</button>
      <button id="btnReset">リセット</button>
      <button id="btnNext">次へ</button>
      <button id="btnToSelector">選択画面に戻る</button>
      <span class="status" id="status"></span>
    </div>

    <div class="card" id="jpCard" style="display:none;">
      <div class="hint">日本語訳（ヒント）</div>
      <div class="jpbox"><b>JP:</b><span id="jpText"></span></div>
    </div>

    <div class="card">
      <div class="hint">上：単語カード（ここから下へドラッグ／タップでも移動）</div>
      <div class="zone" id="bank"></div>
    </div>

    <div class="card">
      <div class="hint">下：あなたの答え（ここに並べる）</div>
      <div class="zone" id="answer"></div>
    </div>

    <div class="card">
      <div class="hint">
        学年：<b id="gName"></b> ／ セット：<b id="setName"></b> ／ 問題 <span id="qno"></span> / <span id="qtotal"></span>
        <span class="pill" id="modeTag" style="display:none;margin-left:8px;">宿題</span>
      </div>
      <div class="metrics">
        <div class="metric">時間：<span id="time">00:00</span></div>
        <div class="metric">ミス：<span id="miss">0</span></div>
        <div class="metric">正解：<span id="done">0</span></div>
      </div>
      <div class="warn" id="csvWarn" style="display:none;"></div>
    </div>
  `);
}

function startGame(csvUrl, allRows){
  renderGameShell();

  const bank = document.getElementById("bank");
  const answer = document.getElementById("answer");
  const statusEl = document.getElementById("status");
  const setNameEl = document.getElementById("setName");
  const gNameEl = document.getElementById("gName");
  const qnoEl = document.getElementById("qno");
  const qtotalEl = document.getElementById("qtotal");
  const timeEl = document.getElementById("time");
  const missEl = document.getElementById("miss");
  const doneEl = document.getElementById("done");
  const modeTag = document.getElementById("modeTag");
  const jpCard = document.getElementById("jpCard");
  const jpText = document.getElementById("jpText");
  const warnBox = document.getElementById("csvWarn");

  const showWarn = (html) => { warnBox.style.display="block"; warnBox.innerHTML = html; };
  const hideWarn = () => { warnBox.style.display="none"; warnBox.innerHTML = ""; };

  const gg = String(G || "").trim();
  gNameEl.textContent = gLabel(gg);
  setNameEl.textContent = SET || "";
  modeTag.style.display = HW ? "inline-block" : "none";

  const QUESTIONS = allRows
    .filter(r => r.g === gg && r.set === SET)
    .map(r => ({ en:r.en, ja:r.ja }));

  qtotalEl.textContent = String(QUESTIONS.length);

  if(QUESTIONS.length === 0){
    statusEl.textContent = "この条件の問題が0件です";
    statusEl.className = "status ng";
    showWarn(`
条件：g=${escapeHtml(gg)} / set=${escapeHtml(SET)}
・CSVの g 列が 1/2/3 か確認
・set が一致しているか確認（大文字小文字も）
・追記が反映されない時は「公開を停止→再公開」
    `.trim());
    return;
  }
  hideWarn();

  let index = 0;
  let miss = 0;
  let done = 0;
  let startAt = null;
  let timerId = null;

  missEl.textContent = "0";
  doneEl.textContent = "0";
  timeEl.textContent = "00:00";
  qnoEl.textContent = "1";

  function startTimerOnce(){
    if(startAt !== null) return;
    startAt = Date.now();
    timerId = setInterval(()=> {
      timeEl.textContent = formatTime(Date.now() - startAt);
    }, 250);
  }
  function stopTimer(){
    if(timerId) clearInterval(timerId);
    timerId = null;
  }

  function clearZones(){
    bank.innerHTML = "";
    answer.innerHTML = "";
    statusEl.textContent = "";
    statusEl.className = "status";
  }

  function makeChip(text){
    const el = document.createElement("div");
    el.className = "chip";
    el.textContent = text;
    el.draggable = true;

    el.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", el.dataset.id);
      startTimerOnce();
    });

    el.addEventListener("click", () => {
      startTimerOnce();
      if(el.parentElement?.id === "bank") answer.appendChild(el);
      else bank.appendChild(el);
    });

    return el;
  }

  function enableDrop(zone){
    zone.addEventListener("dragover", (e) => e.preventDefault());
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const chip = document.querySelector(`[data-id="${id}"]`);
      if(chip) zone.appendChild(chip);
      startTimerOnce();
    });
  }
  enableDrop(bank);
  enableDrop(answer);

  function loadQuestion(){
    clearZones();
    qnoEl.textContent = String(index + 1);

    const jp = (QUESTIONS[index]?.ja || "").trim();
    if(jp){
      jpCard.style.display = "block";
      jpText.textContent = jp;
    }else{
      jpCard.style.display = "none";
      jpText.textContent = "";
    }

    const tokens = tokenize(QUESTIONS[index].en);
    const mixed = shuffle(tokens);

    mixed.forEach((t, k) => {
      const chip = makeChip(t);
      chip.dataset.id = `${index}-${k}-${Math.random().toString(16).slice(2)}`;
      bank.appendChild(chip);
    });
  }

  function currentAnswer(){
    return [...answer.querySelectorAll(".chip")].map(x => x.textContent).join(" ").trim();
  }

  function isCorrect(ans, correct){
    return normalizeForCheck(ans) === normalizeForCheck(correct);
  }

  function showFinish(){
    stopTimer();
    const totalTime = (startAt === null) ? "00:00" : timeEl.textContent;
    const html = `
      <div style="margin-top:10px;line-height:1.7">
        🎉 <b>全問クリア！</b><br>
        時間：<b>${escapeHtml(totalTime)}</b><br>
        ミス：<b>${escapeHtml(String(miss))}</b><br><br>
        <div class="row" style="margin-top:6px">
          <button onclick="location.href='${escapeHtml(buildUrl({g: gg, csv: csvUrl||""}))}'">選択画面に戻る</button>
          <button onclick="location.href='${escapeHtml(buildUrl({g: gg, set: SET, hw: HW ? "1" : "", csv: csvUrl||""}))}'">もう一回</button>
          <button onclick="location.href='${escapeHtml(buildUrl({view:"homework", csv: csvUrl||""}))}'">宿題ページ</button>
        </div>
        <div class="small" style="margin-top:8px">
          ※ 宿題のときは、ここでスクショして提出してね。
        </div>
      </div>
    `;
    statusEl.innerHTML = html;
    statusEl.className = "status ok";
  }

  loadQuestion();

  document.getElementById("btnToSelector").addEventListener("click", () => {
    location.href = buildUrl({ g: gg, csv: csvUrl || "" });
  });

  document.getElementById("btnCheck").addEventListener("click", () => {
    const correct = QUESTIONS[index].en.trim();
    const ans = currentAnswer();

    if(!ans){
      statusEl.textContent = "下に並べてから答え合わせしてね。";
      statusEl.className = "status ng";
      return;
    }

    if(isCorrect(ans, correct)){
      statusEl.textContent = "正解！🎉";
      statusEl.className = "status ok";
    }else{
      miss++;
      missEl.textContent = String(miss);
      statusEl.textContent = "まだちがうよ。もう一回！";
      statusEl.className = "status ng";
    }
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    [...answer.querySelectorAll(".chip")].forEach(chip => bank.appendChild(chip));
    statusEl.textContent = "";
    statusEl.className = "status";
  });

  document.getElementById("btnNext").addEventListener("click", () => {
    startTimerOnce();

    const correct = QUESTIONS[index].en.trim();
    const ans = currentAnswer();

    if(isCorrect(ans, correct)){
      done++;
      doneEl.textContent = String(done);
    }

    if(done >= QUESTIONS.length){
      showFinish();
      return;
    }

    index = (index + 1) % QUESTIONS.length;
    loadQuestion();
  });
}

/** ---------------- init ---------------- */
(async function init(){
  const csvFromQuery = normalizeCsvUrl(getCsvFromQuery());
  const csvFromLS = normalizeCsvUrl(getCsvFromStorage());
  const csvUrl = normalizeCsvUrl(csvFromQuery || csvFromLS || DEFAULT_CSV_URL);

  if(VIEW === "homework"){
    if(!csvUrl){ showStudentHome("", false); return; }
    showHomework(csvUrl);
    return;
  }

  if(TEACHER){
    showTeacherSetup(csvUrl, "");
    return;
  }

  if(!csvUrl){
    showStudentHome("", false);
    return;
  }

  let rows = [];
  try{
    rows = await fetchCSVOnce(csvUrl);
  }catch(e){
    showTeacherSetup(csvUrl, "CSVが読み込めませんでした。\nURLや「ウェブに公開」を確認してください。\n" + (e?.message || String(e)));
    return;
  }

  if(rows.length === 0){
    showTeacherSetup(csvUrl, "CSVに問題が見つかりません。\n列（g / set / sentence / ja）を確認してください。");
    return;
  }

  if(SET){
    if(!G){
      showStudentHome(csvUrl, true);
      return;
    }
    startGame(csvUrl, rows);
    return;
  }

  if(G){
    showSetSelector(csvUrl, rows);
    return;
  }

  showStudentHome(csvUrl, true);
})();
</script>
</body>
</html>
