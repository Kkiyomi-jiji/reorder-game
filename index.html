<script>

/** ★先生が触るのはここだけ（任意） */
const DEFAULT_CSV_URL = ""; // 自分用のCSVを固定したいならここに入れる（空でもOK）

/** ★宿題ページ（任意：あなた用に書き換えOK） */
const TODAY_HOMEWORK = {
  title: "今日の宿題はこちら",
  note: "最後に出る結果をスクショして提出してね。",
  items: [
    { set: "g1_u01", label: "宿題① 1年 g1_u01" },

/** ====== ここから下は基本触らない ====== */
const LS_KEY = "kct_wordorder_csv_v3";
const root = document.getElementById("root");
const params = new URLSearchParams(location.search);

const VIEW = (params.get("view") || "").trim();      // view=homework
let SET = (params.get("set") || "").trim();          // set=...
const HW = (params.get("hw") === "1");
const TEACHER = (params.get("teacher") === "1");
const GRADE = (params.get("grade") || "").trim();    // grade=1/2/3/all/other

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function footerHtml(){
  return `
    <div class="footer">
      <b>Kimi’s Classroom Tools</b><br>
      Created by Kimi
    </div>
  `;
}
function setRootHtml(html){
  root.innerHTML = html + footerHtml();
}

function normalizeCsvUrl(u){ return (u || "").trim(); }

function getCsvFromQuery(){
  const q = params.get("csv");
  if(!q) return "";
  try { return decodeURIComponent(q); } catch { return q; }
}
function getCsvFromStorage(){
  try { return localStorage.getItem(LS_KEY) || ""; } catch { return ""; }
}
function saveCsvToStorage(u){
  try { localStorage.setItem(LS_KEY, u); } catch {}
}
function clearStoredCsv(){
  try { localStorage.removeItem(LS_KEY); } catch {}
}

function buildUrl(qsObj){
  const base = location.origin + location.pathname;
  const qs = new URLSearchParams();
  for(const [k,v] of Object.entries(qsObj || {})){
    if(v !== undefined && v !== null && String(v).trim() !== ""){
      qs.set(k, String(v));
    }
  }
  const s = qs.toString();
  return s ? (base + "?" + s) : base;
}

function goStudentHome(csvUrl){
  location.href = buildUrl({ csv: csvUrl || "" }); // 生徒トップ（setなし）
}
function goTeacher(csvUrl){
  location.href = buildUrl({ teacher: "1", csv: csvUrl || "" });
}
function goHomework(csvUrl){
  location.href = buildUrl({ view:"homework", csv: csvUrl || "" });
}
function goGrade(csvUrl, grade){
  location.href = buildUrl({ grade: grade, csv: csvUrl || "" });
}
function goSet(csvUrl, setKey, homework=false){
  location.href = buildUrl({ set: setKey, hw: homework ? "1" : "", csv: csvUrl || "", grade: GRADE || "" });
}

/** ---------------- CSV parse ----------------
 * 想定列：
 *  set,sentence,ja
 *  - ja列なし(2列)でもOK
 *  - カンマ含みはダブルクォート対応
 */
function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let i = 0;
  let field = "";
  let inQuotes = false;
  const pushField = (arr) => { arr.push(field); field = ""; };
  let current = [];

  while(i < text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      } else { field += c; i++; continue; }
    } else {
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ','){ pushField(current); i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){
        pushField(current);
        rows.push(current);
        current = [];
        i++; continue;
      }
      field += c; i++; continue;
    }
  }
  pushField(current);
  if(current.length > 1 || (current[0] ?? "").trim() !== "") rows.push(current);

  // headerを捨てる
  if(rows.length > 0) rows.shift();

  return rows
    .filter(r => r.length >= 2)
    .map(r => ({
      set: String(r[0] ?? "").trim(),
      en:  String(r[1] ?? "").trim(),
      ja:  String(r.slice(2).join(",") ?? "").trim()
    }))
    .filter(r => r.set && r.en);
}

async function fetchCSVOnce(csvUrl){
  const url = csvUrl + (csvUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("fetch failed: " + res.status + " " + res.statusText);
  const text = await res.text();
  return parseCSV(text);
}

function buildSetList(rows){
  return [...new Set(rows.map(r => r.set))].sort((a,b)=>a.localeCompare(b,"ja"));
}

/** ---------------- Grade helpers ----------------
 * set命名おすすめ：
 *  g1_u01..., g2_..., g3_..., それ以外は other
 */
function guessGradeFromSet(setName){
  const s = (setName || "").toLowerCase();
  if(s.startsWith("g1_") || s.startsWith("1_")) return "1";
  if(s.startsWith("g2_") || s.startsWith("2_")) return "2";
  if(s.startsWith("g3_") || s.startsWith("3_")) return "3";
  return "other";
}
function filterSetsByGrade(setList, grade){
  const g = (grade || "").toLowerCase();
  if(!g || g === "all") return setList;
  return setList.filter(s => guessGradeFromSet(s) === g);
}
function gradeLabel(g){
  if(g === "1") return "1年";
  if(g === "2") return "2年";
  if(g === "3") return "3年";
  if(g === "other") return "その他";
  return "ぜんぶ";
}

/** ---------------- Time / shuffle ---------------- */
function formatTime(ms){
  const s = Math.floor(ms/1000);
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return `${mm}:${ss}`;
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function tokenize(sentence){
  return sentence.trim().split(/\s+/);
}

/** =========================

            <button class="gradebtn" onclick="location.href='${escapeHtml(buildUrl({grade:"all", csv:csvUrl||""}))}'">ぜんぶ</button>

      <div class="row" style="margin-top:16px;justify-content:center">

/** =========================
 * UI: 先生設定画面（teacher=1）
 * - CSV URLを貼って保存
 * - 以後はその端末では生徒トップでセットが出る
 * ========================= */
function showTeacherSetup(csvUrl, errMsg=""){
  setRootHtml(`
    <div style="max-width:760px;margin:40px auto 0;padding:0 10px">
      <h1 style="font-size:22px;margin:0 0 10px">先生設定</h1>
      <div class="small">
        ① スプレッドシート列：<code>set</code> / <code>sentence</code> / <code>ja</code>（jaは任意）<br>

      </div>

      <div class="card">
        <div class="hint">CSV URL</div>
        <input id="csvInput" type="text" value="${escapeHtml(csvUrl||"")}"
          placeholder="https://docs.google.com/.../pub?output=csv" />
        <div class="row" style="margin-top:10px">
          <button class="btnbig" id="btnSave">保存して生徒画面へ</button>
          <button id="btnClear">保存を消す</button>
          <button id="btnHow">公開のしかた</button>
          <button id="btnBack">生徒画面へ戻る</button>
        </div>
        <div class="warn" id="warn" style="display:${errMsg? "block":"none"}">${escapeHtml(errMsg)}</div>
      </div>

      <div class="card">
        <div class="hint">同僚に配るとき（混ざりません）</div>
        <div class="small">
          同僚は同僚のCSVを使えばOK：<br>
          <code>${escapeHtml(location.origin + location.pathname)}?csv=（同僚のCSV URL）</code><br>
          ※ CSVの保存は「その先生の端末のブラウザ内」なので、他の人と混ざりません。
        </div>
      </div>
    </div>
  `);

  const input = document.getElementById("csvInput");
  const warn = document.getElementById("warn");
  const showWarn = (html) => { warn.style.display="block"; warn.innerHTML = html; };

  document.getElementById("btnSave").addEventListener("click", () => {
    const u = normalizeCsvUrl(input.value);
    if(!u){

      return;
    }
    saveCsvToStorage(u);
    goStudentHome(u);
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    clearStoredCsv();
    showWarn("この端末の保存を消しました。");
  });

  document.getElementById("btnHow").addEventListener("click", () => {
    showWarn(`
<b>公開のしかた</b>
1) スプレッドシート → ファイル
2) 共有 → ウェブに公開
3) URLの最後が pub?output=csv のリンクを使う
4) 追記したのに反映されない時は「公開を停止→再公開」
    `.trim());
  });

  document.getElementById("btnBack").addEventListener("click", () => {
    goStudentHome(normalizeCsvUrl(getCsvFromQuery() || getCsvFromStorage() || DEFAULT_CSV_URL));
  });
}

        <div style="margin-top:6px"><a href="${url}">${url}</a></div>

  setRootHtml(`
    <div style="max-width:760px;margin:40px auto 0;padding:0 16px">

/** =========================
 * Game
 * ========================= */
function renderGameShell(){
  setRootHtml(`
    <h1>Word Order Game</h1>

    <div class="row">
      <button id="btnCheck">答え合わせ</button>
      <button id="btnReset">リセット</button>
      <button id="btnNext">次へ</button>
      <button id="btnToSelector">選択画面に戻る</button>
      <span class="status" id="status"></span>
    </div>

    <div class="card" id="jpCard" style="display:none;">
      <div class="hint">日本語訳（ヒント）</div>
      <div class="jpbox"><b>JP:</b><span id="jpText"></span></div>
    </div>

    <div class="card">
      <div class="hint">上：単語カード（ここから下へドラッグ／タップでも移動）</div>
      <div class="zone" id="bank"></div>
    </div>

    <div class="card">
      <div class="hint">下：あなたの答え（ここに並べる）</div>
      <div class="zone" id="answer"></div>
    </div>

    <div class="card">
      <div class="hint">
        セット：<b id="setName"></b> ／ 問題 <span id="qno"></span> / <span id="qtotal"></span>
        <span class="pill" id="modeTag" style="display:none;margin-left:8px;">宿題</span>
      </div>
      <div class="metrics">
        <div class="metric">時間：<span id="time">00:00</span></div>
        <div class="metric">ミス：<span id="miss">0</span></div>
        <div class="metric">正解：<span id="done">0</span></div>
      </div>
      <div class="warn" id="csvWarn" style="display:none;"></div>
    </div>
  `);
}

function startGame(csvUrl, allRows){
  renderGameShell();

  const bank = document.getElementById("bank");
  const answer = document.getElementById("answer");
  const statusEl = document.getElementById("status");
  const setNameEl = document.getElementById("setName");
  const qnoEl = document.getElementById("qno");
  const qtotalEl = document.getElementById("qtotal");
  const timeEl = document.getElementById("time");
  const missEl = document.getElementById("miss");
  const doneEl = document.getElementById("done");
  const modeTag = document.getElementById("modeTag");
  const jpCard = document.getElementById("jpCard");
  const jpText = document.getElementById("jpText");
  const warnBox = document.getElementById("csvWarn");

  const showWarn = (html) => { warnBox.style.display="block"; warnBox.innerHTML = html; };
  const hideWarn = () => { warnBox.style.display="none"; warnBox.innerHTML = ""; };

  const QUESTIONS = allRows.filter(r => r.set === SET).map(r => ({ en:r.en, ja:r.ja }));

  setNameEl.textContent = SET || "";
  modeTag.style.display = HW ? "inline-block" : "none";
  qtotalEl.textContent = String(QUESTIONS.length);

  if(QUESTIONS.length === 0){
    statusEl.textContent = `セット「${SET}」が0件です`;
    statusEl.className = "status ng";
    showWarn(`
このセットが見つかりません。
・CSVのset列に「${escapeHtml(SET)}」があるか確認
・追記したのに反映されない時は「公開を停止→再公開」
    `.trim());
    return;
  }
  hideWarn();

  let index = 0;
  let miss = 0;
  let done = 0;
  let startAt = null;
  let timerId = null;

  missEl.textContent = "0";
  doneEl.textContent = "0";
  timeEl.textContent = "00:00";
  qnoEl.textContent = "1";

  function startTimerOnce(){
    if(startAt !== null) return;
    startAt = Date.now();
    timerId = setInterval(()=> {
      timeEl.textContent = formatTime(Date.now() - startAt);
    }, 250);
  }
  function stopTimer(){
    if(timerId) clearInterval(timerId);
    timerId = null;
  }

  function clearZones(){
    bank.innerHTML = "";
    answer.innerHTML = "";
    statusEl.textContent = "";
    statusEl.className = "status";
  }

  function makeChip(text){
    const el = document.createElement("div");
    el.className = "chip";
    el.textContent = text;
    el.draggable = true;

    el.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", el.dataset.id);
      startTimerOnce();
    });

    el.addEventListener("click", () => {
      startTimerOnce();
      if(el.parentElement?.id === "bank") answer.appendChild(el);
      else bank.appendChild(el);
    });

    return el;
  }

  function enableDrop(zone){
    zone.addEventListener("dragover", (e) => e.preventDefault());
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const chip = document.querySelector(`[data-id="${id}"]`);
      if(chip) zone.appendChild(chip);
      startTimerOnce();
    });
  }
  enableDrop(bank);
  enableDrop(answer);

  function loadQuestion(){
    clearZones();
    qnoEl.textContent = String(index + 1);

    const jp = (QUESTIONS[index]?.ja || "").trim();
    if(jp){
      jpCard.style.display = "block";
      jpText.textContent = jp;
    }else{
      jpCard.style.display = "none";
      jpText.textContent = "";
    }

    const tokens = tokenize(QUESTIONS[index].en);
    const mixed = shuffle(tokens);

    mixed.forEach((t, k) => {
      const chip = makeChip(t);
      chip.dataset.id = `${index}-${k}-${Math.random().toString(16).slice(2)}`;
      bank.appendChild(chip);
    });
  }

  function currentAnswer(){
    return [...answer.querySelectorAll(".chip")].map(x => x.textContent).join(" ").trim();
  }

  function showFinish(){
    stopTimer();
    const totalTime = (startAt === null) ? "00:00" : timeEl.textContent;
    const html = `
      <div style="margin-top:10px;line-height:1.7">
        🎉 <b>全問クリア！</b><br>
        時間：<b>${escapeHtml(totalTime)}</b><br>
        ミス：<b>${escapeHtml(String(miss))}</b><br><br>
        <div class="row" style="margin-top:6px">
          <button onclick="location.href='${escapeHtml(buildUrl({grade: GRADE||"", csv: csvUrl||""}))}'">選択画面に戻る</button>
          <button onclick="location.href='${escapeHtml(buildUrl({set: SET, hw: HW ? "1" : "", grade: GRADE||"", csv: csvUrl||""}))}'">もう一回</button>
          <button onclick="location.href='${escapeHtml(buildUrl({view:"homework", csv: csvUrl||""}))}'">宿題ページ</button>
        </div>
        <div class="small" style="margin-top:8px">
          ※ 宿題のときは、ここでスクショして提出してね。
        </div>
      </div>
    `;
    statusEl.innerHTML = html;
    statusEl.className = "status ok";
  }

  loadQuestion();

  document.getElementById("btnToSelector").addEventListener("click", () => {
    location.href = buildUrl({ grade: GRADE||"all", csv: csvUrl||"" });
  });

  document.getElementById("btnCheck").addEventListener("click", () => {
    const correct = QUESTIONS[index].en.trim();
    const ans = currentAnswer();

    if(!ans){
      statusEl.textContent = "下に並べてから答え合わせしてね。";
      statusEl.className = "status ng";
      return;
    }

    if(ans === correct){
      statusEl.textContent = "正解！🎉";
      statusEl.className = "status ok";
    }else{
      miss++;
      missEl.textContent = String(miss);
      statusEl.textContent = "まだちがうよ。もう一回！";
      statusEl.className = "status ng";
    }
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    [...answer.querySelectorAll(".chip")].forEach(chip => bank.appendChild(chip));
    statusEl.textContent = "";
    statusEl.className = "status";
  });

  document.getElementById("btnNext").addEventListener("click", () => {
    startTimerOnce();

    const correct = QUESTIONS[index].en.trim();
    const ans = currentAnswer();

    if(ans === correct){
      done++;
      doneEl.textContent = String(done);
    }

    if(done >= QUESTIONS.length){
      showFinish();
      return;
    }

    index = (index + 1) % QUESTIONS.length;
    loadQuestion();
  });
}

/** =========================
 * init (ルーティング)
 * ========================= */
(async function init(){
  const csvFromQuery = normalizeCsvUrl(getCsvFromQuery());
  const csvFromLS = normalizeCsvUrl(getCsvFromStorage());
  const csvUrl = normalizeCsvUrl(csvFromQuery || csvFromLS || DEFAULT_CSV_URL);

  // 宿題ページ
  if(VIEW === "homework"){
    if(!csvUrl){
      // CSVが無いなら先生設定へ誘導
      showStudentHome("", false);
      return;
    }
    showHomework(csvUrl);
    return;
  }

  // 先生モード（設定画面）
  if(TEACHER){
    showTeacherSetup(csvUrl, "");
    return;
  }

  // CSVが無い → 生徒トップ（先生誘導）
  if(!csvUrl){
    showStudentHome("", false);
    return;
  }

  // CSVがある → 読み込み
  let rows = [];
  try{
    rows = await fetchCSVOnce(csvUrl);
  }catch(e){
    // 先生だけは原因が分かるように teacher へ
    showTeacherSetup(csvUrl, "CSVが読み込めませんでした。\nURLや「ウェブに公開」を確認してください。\n" + (e?.message || String(e)));
    return;
  }

  const setList = buildSetList(rows);
  if(setList.length === 0){
    showTeacherSetup(csvUrl, "CSVに問題が見つかりません。\n列（set / sentence / ja）を確認してください。");
    return;
  }

  // set指定がある → ゲーム
  if(SET){
    startGame(csvUrl, rows);
    return;
  }

  // 生徒トップ or 学年で絞ったセット選択へ
  if(GRADE){
    showSetSelector(csvUrl, setList);
    return;
  }

  // 何も指定なし → 生徒トップ（学年ボタンへ）
  showStudentHome(csvUrl, true);
})();
</script>
